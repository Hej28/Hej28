name: Update profile metrics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile-metrics.yml']
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate transparent profile cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/update_profile.py
      - name: Save updated metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update profile metrics'
            git push
          fi
