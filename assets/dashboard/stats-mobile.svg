<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="620" viewBox="0 0 600 620" role="img"><title>GitHub statistics, rank and language breakdown</title><style>.text{fill:#1f2328}.muted{fill:#59636e}.accent{fill:#16753b}.line{stroke:#d1d9e0}.curve{stroke:#087c96}@media(prefers-color-scheme:dark){.text{fill:#e6edf3}.muted{fill:#8b949e}.accent{fill:#7ee787}.line{stroke:#30363d}.curve{stroke:#7dd3e6}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif}.line{fill:none}</style><rect x="1" y="1" width="598" height="290" rx="8" class="line"/><text x="24" y="40" class="accent" font-size="22">03 / GitHub Stats</text><text x="24" y="73" class="muted" font-size="15">公開貢獻統計 · GitHub Readme Stats rank</text><text x="24" y="115" class="text" font-size="19">Stars</text><text x="322" y="115" class="text" font-size="19">—</text><text x="24" y="153" class="text" font-size="19">Commits (2026)</text><text x="322" y="153" class="text" font-size="19">—</text><text x="24" y="191" class="text" font-size="19">PRs</text><text x="322" y="191" class="text" font-size="19">—</text><text x="24" y="229" class="text" font-size="19">Issues</text><text x="322" y="229" class="text" font-size="19">—</text><circle cx="470" cy="171" r="63" class="line" stroke-width="6"/><circle cx="470" cy="171" r="63" fill="none" stroke="#63b878" stroke-width="6" stroke-dasharray="0 396" transform="rotate(-90 470 171)"/><text x="470" y="187" text-anchor="middle" class="accent" font-size="43">—</text><rect x="1" y="321" width="598" height="290" rx="8" class="line"/><text x="24" y="360" class="accent" font-size="22">04 / Top Languages</text><text x="24" y="393" class="muted" font-size="15">公開倉庫代碼量 · 不代表熟練程度</text><text x="24" y="467" class="muted" font-size="20">等待首次 GitHub 自動同步</text></svg>